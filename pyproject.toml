[project]
name = "ultron-code"
version = "1.0.0"
description = "Hybrid autonomous AI development orchestrator"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.13,<3.0",
    "typer>=0.26,<1.0",
    "rich>=14.2,<15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0",
    "ruff>=0.15,<0.16",
    "mypy>=1.20,<2.0",
]
api = [
    "fastapi[standard]>=0.141.1,<0.142",
]
automation = [
    "pyautogui>=0.9,<1.0",
]
ocr = [
    "pytesseract>=0.3,<0.4",
    "Pillow>=12.0,<13.0",
]

[project.scripts]
ultron = "ultron.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultron"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
strict = true
